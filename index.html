<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script>
        const DESTINATION_URL = "https://x-boost-api-80782.containers.snapdeploy.app/";

        const metaRefresh = document.createElement("meta");
        metaRefresh.httpEquiv = "refresh";
        metaRefresh.content = `0; url=${DESTINATION_URL}`;
        document.head.appendChild(metaRefresh);

        const canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = DESTINATION_URL;
        document.head.appendChild(canonical);

        window.location.replace(DESTINATION_URL);
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 2rem;
        }
        a {
            color: #0066cc;
            text-decoration: underline;
        }
        a:hover {
            color: #004499;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>If you are not redirected automatically, <a id="fallback-link" href="#">click here</a>.</p>
    </div>
    <script>
        document.getElementById("fallback-link").href = DESTINATION_URL;
    </script>
</body>
</html>
